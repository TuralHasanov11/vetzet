services:
  web-app:
    build:
      context: ./src/web-app
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    ports:
      - "3000:3000"
    env_file:
      - ./src/web-app/.env
    environment:
      - HOST=0.0.0.0
      - PORT=3000
  
  